name: Export MobileSAM to ONNX & Release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Clone MobileSAM repo
        run: git clone https://github.com/ChaoningZhang/MobileSAM.git

      - name: Install dependencies
        run: |
          cd MobileSAM
          pip install torch torchvision timm opencv-python pillow
          pip install onnx onnxsim

      # ✅ 关键修复：export PYTHONPATH=./
      - name: Export ONNX (official script)
        run: |
          cd MobileSAM
          export PYTHONPATH=./
          python scripts/export_onnx_model.py \
            --checkpoint weights/mobile_sam.pt \
            --model-type vit_t \
            --output mobile_sam.onnx

      - name: Prepare output
        run: |
          mkdir -p output
          cp MobileSAM/mobile_sam.onnx output/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-sam-onnx
          files: output/mobile_sam.onnx