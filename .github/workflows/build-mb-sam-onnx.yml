name: Export MobileSAM to ONNX & Release

on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision onnx onnxruntime onnxsim timm

      - name: Download MobileSAM model
        run: |
          mkdir -p weights
          wget https://github.com/ChaoningZhang/MobileSAM/raw/master/weights/mobile_sam.pt -O weights/mobile_sam.pt

      - name: Clone MobileSAM repo
        run: git clone https://github.com/ChaoningZhang/MobileSAM.git

      - name: Run ONNX export
        run: |
          cp scripts/MobileSAM/export_onnx.py MobileSAM/
          cd MobileSAM
          python export_onnx.py

      - name: Prepare output file
        run: |
          mkdir -p output
          cp MobileSAM/mobile_sam.onnx output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-sam-onnx
          files: output/mobile_sam.onnx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}