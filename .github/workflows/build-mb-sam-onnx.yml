name: Export MobileSAM to ONNX & Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision onnx onnxsim

      - name: Download MobileSAM model
        run: |
          mkdir -p weights
          wget https://github.com/ChaoningZhang/MobileSAM/raw/master/weights/mobile_sam.pt -O weights/mobile_sam.pt

      - name: Clone MobileSAM repo
        run: git clone https://github.com/ChaoningZhang/MobileSAM.git

