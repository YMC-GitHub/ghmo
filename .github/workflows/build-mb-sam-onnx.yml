name: Export MobileSAM ONNX (Official)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Clone MobileSAM
        run: git clone https://github.com/ChaoningZhang/MobileSAM.git

      - name: Install dependencies (official way)
        run: |
          cd MobileSAM
          # 核心依赖
          pip install torch torchvision
          # 安装本体
          pip install -e .
          # 导出必需依赖（含 onnxscript）
          pip install onnx onnxruntime onnxscript opencv-python matplotlib

      - name: Download mobile_sam.pt
        run: |
          cd MobileSAM/weights
          wget https://github.com/ChaoningZhang/MobileSAM/releases/download/v0.0.1/mobile_sam.pt

      - name: Export ONNX (official script)
        run: |
          cd MobileSAM
          export PYTHONPATH=.
          python scripts/export_onnx_model.py \
            --checkpoint weights/mobile_sam.pt \
            --model-type vit_t \
            --output mobile_sam.onnx

      - name: Upload ONNX
        uses: actions/upload-artifact@v4
        with:
          name: mobile_sam.onnx
          path: MobileSAM/mobile_sam.onnx