name: Build Florence2 Model & Release

on:
  # push:
  #   branches: [ main ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 关键：允许发布 Release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 构建 Docker 并导出 model.onnx
      - name: Build model.onnx
        run: |
          docker build --progress=plain -f Dockerfile.fdwm_pre --output=./output .

      # 上传产物(可在actions下载)
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: florence2-model
          path: output/model.onnx

      # 创建 Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        # if: startsWith(github.ref, 'refs/heads/main')
        with:
          name: Florence2 ONNX Model
          tag_name: v1.0.0
          files: output/model.onnx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}